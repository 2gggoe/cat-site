<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #0d0d0f;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: pointer;
    font-family: 'Georgia', serif;
  }

  #canvas-container {
    width: 100%;
    height: 100%;
    position: relative;
  }

  canvas {
    display: block;
  }

  #hint {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.18);
    font-size: 13px;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    pointer-events: none;
    transition: opacity 1s ease;
    user-select: none;
  }

  #hint.hidden {
    opacity: 0;
  }

  /* subtle vignette */
  #vignette {
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.72) 100%);
    pointer-events: none;
    z-index: 1;
  }

  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #0d0d0f;
    z-index: 99;
    color: rgba(255,255,255,0.25);
    font-size: 13px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    transition: opacity 0.8s ease;
  }

  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="loading">loading...</div>
<div id="canvas-container"></div>
<div id="vignette"></div>
<div id="hint">click anywhere</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ─── Scene Setup ─────────────────────────────────────────────────────────────

const container = document.getElementById('canvas-container');
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 0.9;
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0d0d0f);
scene.fog = new THREE.Fog(0x0d0d0f, 8, 22);

// ─── Camera ───────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 100);
camera.position.set(0, 1.4, 4.5);

// ─── Controls (subtle drift only) ─────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.enableZoom = false;
controls.enablePan = false;
controls.minPolarAngle = Math.PI * 0.3;
controls.maxPolarAngle = Math.PI * 0.65;
controls.minAzimuthAngle = -Math.PI * 0.25;
controls.maxAzimuthAngle =  Math.PI * 0.25;
controls.target.set(0, 1.0, 0);
controls.update();

// ─── Lighting ─────────────────────────────────────────────────────────────────
// Warm key light from upper-left
const keyLight = new THREE.DirectionalLight(0xfff0e0, 2.2);
keyLight.position.set(-2, 5, 3);
keyLight.castShadow = true;
keyLight.shadow.mapSize.width = 1024;
keyLight.shadow.mapSize.height = 1024;
keyLight.shadow.camera.near = 0.5;
keyLight.shadow.camera.far = 20;
scene.add(keyLight);

// Cool fill from right
const fillLight = new THREE.DirectionalLight(0xd0e8ff, 0.8);
fillLight.position.set(3, 2, -1);
scene.add(fillLight);

// Ambient
const ambient = new THREE.AmbientLight(0x1a1a2e, 3.0);
scene.add(ambient);

// Subtle rim from behind
const rimLight = new THREE.DirectionalLight(0xffeedd, 0.5);
rimLight.position.set(0, 3, -4);
scene.add(rimLight);

// Ground plane (subtle reflection)
const groundGeo = new THREE.PlaneGeometry(20, 20);
const groundMat = new THREE.MeshStandardMaterial({
  color: 0x111114,
  roughness: 0.95,
  metalness: 0.0
});
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ─── Animation State ──────────────────────────────────────────────────────────
let mixer = null;
let action = null;
let isOpen = false;
let isAnimating = false;

// ─── Load FBX ─────────────────────────────────────────────────────────────────
const loader = new FBXLoader();
loader.load(
  'cat.fbx',  // <-- put cat.fbx in the same folder as this index.html
  (fbx) => {
    // Scale & center
    const box = new THREE.Box3().setFromObject(fbx);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    const maxDim = Math.max(size.x, size.y, size.z);
    const scale = 2.2 / maxDim;
    fbx.scale.setScalar(scale);

    // Center horizontally, sit on ground
    fbx.position.x = -center.x * scale;
    fbx.position.y = -box.min.y * scale;
    fbx.position.z = -center.z * scale;

    // Shadows
    fbx.traverse((child) => {
      if (child.isMesh) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    scene.add(fbx);

    // Setup animation
    if (fbx.animations && fbx.animations.length > 0) {
      mixer = new THREE.AnimationMixer(fbx);
      action = mixer.clipAction(fbx.animations[0]);
      action.loop = THREE.LoopOnce;
      action.clampWhenFinished = true;
      action.play();
      action.paused = true;
      action.time = 0;
      mixer.update(0);
    }

    // Hide loading screen
    const loadingEl = document.getElementById('loading');
    loadingEl.classList.add('hidden');
    setTimeout(() => loadingEl.remove(), 1000);
  },
  (xhr) => {
    const pct = Math.round(xhr.loaded / xhr.total * 100);
    document.getElementById('loading').textContent = `loading... ${pct}%`;
  },
  (err) => {
    console.error('FBX load error:', err);
    document.getElementById('loading').textContent = 'error loading model :(';
  }
);

// ─── Click Handler ────────────────────────────────────────────────────────────
let hintHidden = false;
document.addEventListener('click', () => {
  if (!action || isAnimating) return;

  // Hide hint on first click
  if (!hintHidden) {
    document.getElementById('hint').classList.add('hidden');
    hintHidden = true;
  }

  isAnimating = true;

  if (!isOpen) {
    // Play forward (open mouth)
    action.paused = false;
    action.timeScale = 1;
    action.time = 0;
    action.play();
    isOpen = true;

    // When animation finishes, allow clicking again
    mixer.addEventListener('finished', () => {
      isAnimating = false;
    }, { once: true });

  } else {
    // Play backward (close mouth)
    const duration = action.getClip().duration;
    action.paused = false;
    action.timeScale = -1;
    action.time = duration;
    action.play();
    isOpen = false;

    mixer.addEventListener('finished', () => {
      isAnimating = false;
    }, { once: true });
  }
});

// ─── Subtle idle float ────────────────────────────────────────────────────────
let idleTime = 0;

// ─── Render Loop ──────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();

  if (mixer) mixer.update(delta);

  // Subtle idle bob
  idleTime += delta;
  if (scene.children) {
    const cat = scene.children.find(c => c.type === 'Group' && c !== ground);
    if (cat) {
      cat.position.y += Math.sin(idleTime * 0.8) * 0.0003;
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();

// ─── Resize ───────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
