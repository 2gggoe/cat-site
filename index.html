<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #111116;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
    cursor: pointer;
  }
  canvas { display: block; }

  #vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 60%, transparent 35%, rgba(0,0,0,0.65) 100%);
    pointer-events: none;
    z-index: 1;
  }

  #hint {
    position: fixed;
    bottom: 36px;
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.2);
    font-family: 'Georgia', serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    pointer-events: none;
    z-index: 2;
    transition: opacity 1.2s ease;
  }
  #hint.gone { opacity: 0; }

  #loading {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: #111116;
    z-index: 99;
    color: rgba(255,255,255,0.2);
    font-family: 'Georgia', serif;
    font-size: 12px;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    transition: opacity 0.9s ease;
  }
  #loading.gone { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="loading">loading...</div>
<div id="vignette"></div>
<div id="hint">click anywhere</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ── Renderer ──────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.4;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

// ── Scene ─────────────────────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x111116);
scene.fog = new THREE.FogExp2(0x111116, 0.06);

// ── Camera ────────────────────────────────────────────────────────────────────
const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.01, 100);
camera.position.set(0, 1.1, 3.8);

// ── Controls ──────────────────────────────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enableZoom = false;
controls.enablePan = false;
controls.minPolarAngle = Math.PI * 0.28;
controls.maxPolarAngle = Math.PI * 0.62;
controls.minAzimuthAngle = -Math.PI * 0.3;
controls.maxAzimuthAngle =  Math.PI * 0.3;
controls.target.set(0, 0.9, 0);
controls.update();

// ── Lights ────────────────────────────────────────────────────────────────────

// Ambient - base illumination
const ambient = new THREE.AmbientLight(0xfff5e0, 3.5);
scene.add(ambient);

// Key light - warm from upper front-left
const key = new THREE.DirectionalLight(0xfff4e0, 5.0);
key.position.set(-1.5, 4, 3);
key.castShadow = true;
key.shadow.mapSize.setScalar(1024);
key.shadow.camera.near = 0.5;
key.shadow.camera.far = 15;
key.shadow.camera.left = -2; key.shadow.camera.right = 2;
key.shadow.camera.top = 3; key.shadow.camera.bottom = -1;
key.shadow.bias = -0.001;
scene.add(key);

// Fill light - cool from right
const fill = new THREE.DirectionalLight(0xddeeff, 2.5);
fill.position.set(3, 2, 1);
scene.add(fill);

// Front fill - makes sure face is lit
const frontFill = new THREE.DirectionalLight(0xffffff, 1.8);
frontFill.position.set(0, 1.5, 5);
scene.add(frontFill);

// Rim / back light
const rim = new THREE.DirectionalLight(0xffe8cc, 1.2);
rim.position.set(0.5, 3, -4);
scene.add(rim);

// Subtle point light near face level
const faceLight = new THREE.PointLight(0xfff0dd, 2.0, 6);
faceLight.position.set(0, 1.4, 2.5);
scene.add(faceLight);

// ── Ground ────────────────────────────────────────────────────────────────────
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(20, 20),
  new THREE.MeshStandardMaterial({ color: 0x141418, roughness: 0.98, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// ── Morph animation state ──────────────────────────────────────────────────────
let mixer = null;
let morphAction = null;
let isOpen = false;
let busy = false;
let catMesh = null;

// Manual morph tween (fallback / primary control)
let morphTarget = 0;
let morphCurrent = 0;
let tweening = false;

// ── Load GLB ──────────────────────────────────────────────────────────────────
const loader = new GLTFLoader();
loader.load('cat.glb', (gltf) => {
  const model = gltf.scene;

  // Center + sit on ground
  const box = new THREE.Box3().setFromObject(model);
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());
  const s = 2.0 / Math.max(size.x, size.y, size.z);
  model.scale.setScalar(s);
  model.position.set(-center.x * s, -box.min.y * s, -center.z * s);

  model.traverse(child => {
    if (child.isMesh) {
      child.castShadow = true;
      child.receiveShadow = true;

      // Apply a nice Siamese cat material since texture is external
      child.material = new THREE.MeshStandardMaterial({
        color: new THREE.Color(0.70, 0.55, 0.40),
        roughness: 0.72,
        metalness: 0.0,
      });

      catMesh = child;
    }
  });

  scene.add(model);

  // Setup AnimationMixer for the GLB animation
  if (gltf.animations && gltf.animations.length > 0) {
    mixer = new THREE.AnimationMixer(model);
    morphAction = mixer.clipAction(gltf.animations[0]);
    morphAction.loop = THREE.LoopOnce;
    morphAction.clampWhenFinished = true;

    // Pause at start
    morphAction.play();
    morphAction.paused = true;
    morphAction.time = 0;
    mixer.update(0);
  }

  // Done loading
  const el = document.getElementById('loading');
  el.classList.add('gone');
  setTimeout(() => el.remove(), 1000);

}, (xhr) => {
  if (xhr.total) {
    document.getElementById('loading').textContent =
      `loading... ${Math.round(xhr.loaded / xhr.total * 100)}%`;
  }
}, (err) => {
  document.getElementById('loading').textContent = 'error loading model :(';
  console.error(err);
});

// ── Click ──────────────────────────────────────────────────────────────────────
document.addEventListener('click', () => {
  document.getElementById('hint')?.classList.add('gone');

  if (!catMesh || busy) return;

  busy = true;
  isOpen = !isOpen;
  morphTarget = isOpen ? 1 : 0;
  tweening = true;
});

// ── Resize ─────────────────────────────────────────────────────────────────────
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ── Render loop ───────────────────────────────────────────────────────────────
const clock = new THREE.Clock();
let idleT = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = clock.getDelta();
  idleT += dt;

  // Smooth morph tween
  if (tweening && catMesh) {
    morphCurrent += (morphTarget - morphCurrent) * Math.min(dt * 7, 1);
    catMesh.morphTargetInfluences[0] = morphCurrent;

    if (Math.abs(morphCurrent - morphTarget) < 0.001) {
      morphCurrent = morphTarget;
      catMesh.morphTargetInfluences[0] = morphTarget;
      tweening = false;
      busy = false;
    }
  }

  // Subtle idle float
  if (scene.children) {
    for (const c of scene.children) {
      if (c.isGroup || (c.isMesh && c !== ground)) {
        c.position.y += Math.sin(idleT * 0.7) * 0.00025;
      }
    }
  }

  controls.update();
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
